<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Set Admin Password | MCM Photography</title>
    <meta name="description" content="Set your MCM Photography administrator password.">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" sizes="32x32" href="../favicon-32x32.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
    <link href="../css/bootstrap.min.css" rel="stylesheet">
    <link href="../css/style.css" rel="stylesheet">
    <link href="assets/admin-dashboard.css" rel="stylesheet">
</head>
<body class="admin-page">
    <main class="backend-panel">
        <a class="backend-brand" href="../index.html">
            <img src="../img/logo.png" alt="">
            <span>MCM Photography</span>
        </a>
        <section class="backend-card" aria-labelledby="password-title">
            <p class="eyebrow">ADMINISTRATION</p>
            <h1 id="password-title">Set your password</h1>
            <p id="password-intro">Use the secure invitation or password-reset link to set your administrator password.</p>
            <form id="set-password-form" class="backend-form" hidden>
                <label for="new-password">New password</label>
                <input id="new-password" name="password" type="password" autocomplete="new-password" minlength="8" maxlength="128" required>
                <label for="confirm-password">Confirm new password</label>
                <input id="confirm-password" name="confirmPassword" type="password" autocomplete="new-password" minlength="8" maxlength="128" required>
                <button class="btn btn-primary mt-3" type="submit">Save password</button>
            </form>
            <p id="password-status" class="backend-status" role="status" aria-live="polite"></p>
            <a class="backend-password-link" href="dashboard.html">Return to admin sign in</a>
        </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
    <script src="../js/backend-config.js" defer></script>
    <script src="../js/mcm-backend.js" defer></script>
    <script src="assets/set-password.js" defer></script>
</body>
</html>
